name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EasyPanel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only deploy if the triggering workflow was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_URL }}

    steps:
      - name: Trigger EasyPanel deployment
        if: ${{ env.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$DEPLOY_WEBHOOK_URL"
